<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piper — Client Portal</title>
<style>
  :root { color-scheme: dark;
    --bg:#0a0a0a; --side:#0d0d0d; --panel:#101010; --card:#121212;
    --border:#232323; --fg:#ededed; --muted:#8b8f94; --dim:#5f6368;
    --green:#6ee7a8; --red:#f87171; --amber:#f6c177; --blue:#8ab4f8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  button { background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:6px;
            padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:#3a3a3a; }
  button:disabled { opacity:.5; cursor:default; }
  input, select, textarea { background:var(--panel); color:var(--fg); border:1px solid var(--border);
            border-radius:6px; padding:6px 8px; font:inherit; }
  a { color:var(--blue); cursor:pointer; }
  .hint { color:var(--muted); font-size:11px; }
  .bad { color:var(--red) !important; }

  /* login */
  #login { max-width:360px; margin:12vh auto; padding:24px; }
  #login h1 { font-size:16px; margin:0 0 4px; }
  #login p { color:var(--muted); margin:0 0 18px; }
  #login .row { display:flex; gap:8px; }
  #login input { flex:1; }
  #pmbody .row { display:flex; gap:8px; margin-top:8px; }
  #pmbody .row:first-child { margin-top:0; }
  #pmbody input { flex:1; }
  .logintabs { margin-bottom:14px; }
  .logintabs .tab { flex:1; background:transparent; }
  .logintabs .tab.on { border-color:var(--blue); color:var(--fg); }
  #loginnote { min-height:16px; margin-top:10px; }

  /* app shell */
  #app { display:none; height:100vh; }
  #app.on { display:flex; }
  .side { width:240px; flex:0 0 240px; background:var(--side); border-right:1px solid var(--border);
          display:flex; flex-direction:column; }
  .side .top { padding:12px; border-bottom:1px solid var(--border); display:flex; gap:6px; }
  .side .top input { flex:1; min-width:0; }
  #convlist { flex:1; overflow:auto; padding:6px; }
  .convrow { padding:8px 32px 8px 10px; border-radius:6px; cursor:pointer; margin-bottom:2px; position:relative; }
  .convrow:hover { background:#161616; }
  .convrow.on { background:#1c1c1c; }
  .convrow .t { font-size:12px; }
  .convrow .s { color:var(--dim); font-size:10px; }
  .livedot { color:var(--green); font-size:9px; }
  .convclear { position:absolute; top:6px; right:6px; border:none; background:transparent; color:var(--dim);
               padding:2px 6px; border-radius:4px; font-size:13px; line-height:1; }
  .convclear:hover { color:var(--red); background:#201414; }
  .side .bottom { padding:10px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .side .bottom span:last-child { display:flex; gap:6px; }
  .who { font-size:11px; color:var(--muted); }

  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .bar { padding:10px 14px; border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:center; }
  .bar select { max-width:220px; }
  .bar button.on { border-color:var(--blue); color:var(--fg); }
  .bar .sp { flex:1; }
  .statusbar { padding:6px 14px; border-bottom:1px solid var(--border); background:var(--panel); font-size:11px;
               color:var(--muted); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .statusbar b { color:var(--fg); font-weight:600; }
  .statusbar .ctxfull { color:var(--amber); }
  #statusstats { display:flex; gap:16px; flex-wrap:wrap; }
  .toolToggle { margin-left:auto; display:flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap; }
  #msgs { flex:1; overflow:auto; padding:16px; }
  .msg { max-width:720px; margin:0 auto 18px; }
  .msg.user .bubble { background:#1c2a1f; border:1px solid #243329; border-radius:10px; padding:8px 12px;
                       white-space:pre-wrap; margin-left:auto; max-width:80%; }
  .md p { margin:0 0 10px; } .md ul, .md ol { margin:0 0 10px; padding-left:22px; } .md li { margin:2px 0; }
  .md h3, .md h4, .md h5, .md h6 { margin:14px 0 6px; } .md blockquote { margin:0 0 10px; padding:2px 12px; border-left:3px solid var(--border); color:var(--muted); }
  .md code { background:#1a1a1a; padding:1px 5px; border-radius:4px; font-size:12px; } .md a { color:var(--blue); } .md hr { border:0; border-top:1px solid var(--border); }
  .md p:last-child, .md ul:last-child, .md ol:last-child { margin-bottom:0; }
  .mdcode { margin:0 0 12px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#0b0b0b; }
  .mdcodebar { display:flex; justify-content:space-between; align-items:center; padding:4px 10px; background:#151515; color:var(--dim); font-size:11px; }
  .mdcodebar button { padding:2px 8px; font-size:11px; }
  .mdcode pre { margin:0; padding:10px 12px; overflow:auto; font-size:12px; line-height:1.5; } .mdcode code { background:none; padding:0; }
  .mdtable { overflow:auto; margin:0 0 12px; } .mdtable table { border-collapse:collapse; } .mdtable th, .mdtable td { border:1px solid var(--border); padding:4px 10px; }
  /* thinking: collapsed by default, an arrow that flips on open */
  details.think { margin:6px 0; }
  details.think summary { cursor:pointer; color:var(--dim); font-size:12px; list-style:none; user-select:none; }
  details.think summary::-webkit-details-marker { display:none; }
  details.think summary:before { content:'▸ '; display:inline-block; width:12px; color:var(--dim); }
  details.think[open] summary:before { content:'▾ '; }
  /* a subtle shimmer across "Thinking..." while the turn is actually still running */
  details.think.live summary {
    background:linear-gradient(90deg, var(--dim) 0%, var(--dim) 35%, var(--fg) 50%, var(--dim) 65%, var(--dim) 100%);
    background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:thinkshimmer 1.7s linear infinite;
  }
  @keyframes thinkshimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
  details.think .think-body { color:var(--dim); font-size:12px; border-left:2px solid var(--border);
                               padding-left:8px; margin-top:4px; white-space:pre-wrap; }
  .think-sub { border-left:3px solid var(--agent-c, var(--blue)); padding:2px 0 2px 8px; margin:2px 0 2px -8px; }
  .think-sub b { color:var(--agent-c, var(--blue)); }

  /* tool calls: <pill>name</pill>: excerpt, click the line to expand the full result */
  .tool-line { display:flex; align-items:baseline; gap:7px; margin:5px 0; cursor:pointer; user-select:none; }
  .tool-pill { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--agent-c, var(--border));
               color:var(--agent-c, var(--fg)); border-radius:999px; padding:2px 10px; font-size:11px; flex:0 0 auto; }
  .tool-line:hover .tool-pill { border-color:var(--agent-c, #3a3a3a); }
  .tool-pill .hammer { font-size:10px; filter:grayscale(.3); }
  .tool-line.error .tool-pill .hammer { filter:none; }
  .tool-excerpt { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .tool-body { display:none; margin:2px 0 8px 4px; padding:8px 10px; background:#0c0c0c; border:1px solid var(--border);
               border-radius:6px; font-size:11px; white-space:pre-wrap; color:var(--muted); }
  .tool-body.open { display:block; }
  .tool-body .tool-section { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.06em;
                              margin:8px 0 3px; }
  .tool-body .tool-section:first-child { margin-top:0; }

  /* a colleague agent's own reply, folded into the caller's — a distinct colored callout per name */
  .colleague-msg { border-left:3px solid var(--agent-c, var(--blue)); background:#111214; padding:8px 10px;
                    border-radius:6px; margin:8px 0; }
  .colleague-msg .who { font-weight:600; font-size:11px; margin-bottom:3px; color:var(--agent-c, var(--blue)); }

  .err { color:var(--red); margin-top:6px; }
  .foot { color:var(--dim); font-size:11px; margin-top:6px; }
  .sys-note { color:var(--dim); font-size:11px; font-style:italic; margin:6px 0; }
  .composer { padding:12px 14px; border-top:1px solid var(--border); display:flex; gap:8px; align-items:flex-end; }
  .composer textarea { flex:1; resize:none; min-height:40px; max-height:160px; }
  #attachbtn { align-self:center; }

  /* pending attachments, above the composer, before send */
  .pending { padding:8px 14px 0; display:flex; flex-wrap:wrap; gap:6px; }
  .pending[hidden] { display:none; }
  .chip { display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--border);
          border-radius:6px; padding:3px 6px; font-size:11px; max-width:220px; }
  .chip img { width:28px; height:28px; object-fit:cover; border-radius:4px; }
  .chip .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip .rm { opacity:.6; cursor:pointer; padding:0 2px; }
  .chip .rm:hover { opacity:1; color:var(--red); }
  .chip.busy { opacity:.6; }

  /* attachments on a sent user message */
  .msg-images { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .msg-images img { max-width:220px; max-height:220px; border-radius:8px; cursor:pointer; display:block; }
  .msg-docs { margin-top:6px; display:flex; flex-direction:column; gap:3px; }
  .msg-docs a { font-size:12px; }

  /* files / tools & extensions / skills panels -- one at a time, same shape */
  .sidebox { width:300px; flex:0 0 300px; border-left:1px solid var(--border); background:var(--side);
             display:none; flex-direction:column; }
  .sidebox.on { display:flex; }
  .sidebox .top { padding:10px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  #crumb { padding:8px 10px; font-size:11px; color:var(--muted); }
  #crumb a { margin-right:2px; }
  #filelist, .plist { flex:1; overflow:auto; padding:0 6px 10px; }
  .frow { padding:6px 8px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; font-size:12px; }
  .frow:hover { background:#161616; }
  .frow .sz { color:var(--dim); font-size:10px; }
  .frow .del { opacity:.5; padding:0 4px; }
  .frow .del:hover { opacity:1; color:var(--red); }
  .plist .psection { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.06em; padding:10px 8px 3px; }
  .plist .prow { padding:6px 8px; border-radius:6px; font-size:12px; }
  .plist .prow .nm { display:flex; justify-content:space-between; gap:6px; }
  .plist .prow .nm b { font-weight:600; }
  .plist .prow .tag { color:var(--dim); font-size:10px; }
  .plist .prow .desc { color:var(--muted); font-size:11px; margin-top:1px; }
  .plist .empty { padding:10px 8px; color:var(--muted); font-size:12px; }

  /* a small modal for previewing/downloading a file */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center;
                    justify-content:center; z-index:50; }
  .modal-overlay[hidden] { display:none; }
  .modal-box.wide { width:min(1100px, 92vw); }
  .modal-box { width:min(680px, 92vw); max-height:84vh; display:flex; flex-direction:column; background:var(--panel);
               border:1px solid var(--border); border-radius:10px; padding:16px; }
  .modal-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:4px; }
  .modal-top b { font-size:13px; word-break:break-all; }
  .modal-body { flex:1; overflow:auto; margin-top:10px; }
  .modal-body pre { white-space:pre-wrap; word-break:break-word; margin:0; font-size:12px; }
  .modal-body img { max-width:100%; display:block; }
  .htmlpreview { width:100%; height:65vh; border:1px solid var(--border); border-radius:6px; background:#fff; }
  .modal-actions { margin-top:12px; text-align:right; }
  .modal-actions a { text-decoration:none; }
</style>
</head>
<body>

<div id="login">
  <h1>Piper client portal</h1>
  <div class="row logintabs">
    <button id="tabkey" class="tab on">API key</button>
    <button id="tabpass" class="tab">Password</button>
  </div>
  <div id="keyform">
    <p>Log in with your own API key to chat with your agents and browse your workspace.</p>
    <div class="row"><input id="keyinput" type="password" placeholder="piper_..." autocomplete="off"></div>
    <div class="row" style="margin-top:8px"><button id="connect">connect</button></div>
  </div>
  <div id="passform" hidden>
    <p>Log in with the username and password you set up for this portal.</p>
    <div class="row"><input id="loginuser" type="text" placeholder="username" autocomplete="username"></div>
    <div class="row" style="margin-top:8px"><input id="loginpass" type="password" placeholder="password" autocomplete="current-password"></div>
    <div class="row" style="margin-top:8px"><button id="connectpass">log in</button></div>
  </div>
  <p id="loginnote" class="hint"></p>
</div>

<div id="app">
  <div class="side">
    <div class="top"><button id="newchat" title="new chat">+ new chat</button><a href="/notebook" style="margin-left:8px" title="notebooks: grounded Q&amp;A over your own sources">&#128211; Notebooks</a></div>
    <div id="convlist"></div>
    <div class="bottom"><span class="who" id="who"></span><span><button id="passbtn" title="portal password">&#9881;</button><button id="logout">log out</button></span></div>
  </div>
  <main>
    <div class="bar">
      <select id="target"></select>
      <div class="sp"></div>
      <button id="toolsbtn">Tools &amp; Extensions</button>
      <button id="skillsbtn">Skills</button>
      <button id="filesbtn" class="on">files</button>
    </div>
    <div id="statusbar" class="statusbar">
      <div id="statusstats"></div>
      <label class="toolToggle"><input type="checkbox" id="toolToggle">show tool calls</label>
    </div>
    <div id="msgs"></div>
    <div id="pending" class="pending" hidden></div>
    <div class="composer">
      <button id="attachbtn" title="attach images or documents">📎</button>
      <input type="file" id="attachinput" multiple hidden>
      <textarea id="input" placeholder="Message your agent... (Enter to send, Shift+Enter for a new line, /piper for commands)"></textarea>
      <button id="send">send</button>
    </div>
  </main>
  <div id="toolsbox" class="sidebox">
    <div class="top"><b>Tools &amp; Extensions</b><button id="toolsrefresh">refresh</button></div>
    <div id="toolslist" class="plist"></div>
  </div>
  <div id="skillsbox" class="sidebox">
    <div class="top"><b>Skills</b><button id="skillsrefresh">refresh</button></div>
    <div id="skillslist" class="plist"></div>
  </div>
  <div id="filesbox" class="sidebox on">
    <div class="top"><b>Files</b><div><button id="uploadbtn">upload</button><button id="filesrefresh">refresh</button></div></div>
    <input type="file" id="uploadinput" multiple hidden>
    <div id="crumb"></div>
    <div id="filelist"></div>
  </div>
</div>

<div id="passmodal" class="modal-overlay" hidden>
  <div class="modal-box">
    <div class="modal-top"><b>Portal password</b><button id="pmclose">close</button></div>
    <div id="pmbody" class="modal-body"></div>
  </div>
</div>

<div id="filemodal" class="modal-overlay" hidden>
  <div class="modal-box" id="fmbox">
    <div class="modal-top"><b id="fmtitle"></b><button id="fmclose">close</button></div>
    <div class="hint" id="fmmeta"></div>
    <div id="fmbody" class="modal-body"></div>
    <div class="modal-actions"><a id="fmdownload" download><button>download</button></a></div>
  </div>
</div>

<script>
'use strict';
function $(id) { return document.getElementById(id); }
function el(tag, text) { var e = document.createElement(tag); if (text !== undefined) e.textContent = text; return e; }

/* ---- a small markdown renderer, for the model's replies ---- */
function mdInline(text) {
  var out = [];
  var i = 0, buf = '';
  function flush() { if (buf) { out.push({ t: 'text', v: buf }); buf = ''; } }
  while (i < text.length) {
    var c = text[i], rest = text.slice(i), m;
    if (c === '\\' && i + 1 < text.length && /[\\`*_{}\[\]()#+\-.!~|>]/.test(text[i + 1])) { buf += text[i + 1]; i += 2; continue; }
    if (c === '`') {
      m = /^(`+)([\s\S]*?[^`])\1(?!`)/.exec(rest);
      if (m) { flush(); out.push({ t: 'code', v: m[2].replace(/^ (.*) $/, '$1') }); i += m[0].length; continue; }
    }
    if (c === '[') {
      m = /^\[([^\]]+)\]\(\s*([^)\s]+)(?:\s+"[^"]*")?\s*\)/.exec(rest);
      if (m) { flush(); out.push({ t: 'a', href: m[2], c: mdInline(m[1]) }); i += m[0].length; continue; }
    }
    if (c === '*' || c === '_' || c === '~') {
      m = (c === '~' ? /^~~([^~]+)~~/ : /^(\*\*|__)(?=\S)([\s\S]*?\S)\1/).exec(rest);
      if (m) { flush(); out.push({ t: c === '~' ? 'del' : 'b', c: mdInline(c === '~' ? m[1] : m[2]) }); i += m[0].length; continue; }
      m = /^([*_])(?=\S)([^*_\n]*?\S)\1(?![\w*_])/.exec(rest);
      if (m && (c === '*' || i === 0 || /\W/.test(text[i - 1]))) { flush(); out.push({ t: 'i', c: mdInline(m[2]) }); i += m[0].length; continue; }
    }
    m = /^https?:\/\/[^\s<>)\]]+[^\s<>)\].,;:!?'"]/.exec(rest);
    if (m && (i === 0 || /[\s(]/.test(text[i - 1]))) { flush(); out.push({ t: 'a', href: m[0], c: [{ t: 'text', v: m[0] }] }); i += m[0].length; continue; }
    buf += c; i += 1;
  }
  flush();
  return out;
}
function mdParse(text) {
  var lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  var blocks = [];
  var i = 0;
  var listRe = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
  function isTableSep(l) { return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l) && l.indexOf('-') >= 0; }
  function cells(l) { return l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (x) { return x.trim(); }); }
  while (i < lines.length) {
    var line = lines[i], m;
    if (!line.trim()) { i++; continue; }
    if ((m = /^\s*(`{3,}|~{3,})\s*([\w+#.-]*)/.exec(line))) {
      var fence = m[1], lang = m[2], body = [];
      i++;
      while (i < lines.length && !new RegExp('^\\s*' + fence[0] + '{' + fence.length + ',}\\s*$').test(lines[i])) { body.push(lines[i]); i++; }
      i++;
      blocks.push({ t: 'code', lang: lang, text: body.join('\n') });
      continue;
    }
    if ((m = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line))) { blocks.push({ t: 'h', n: m[1].length, c: mdInline(m[2]) }); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { blocks.push({ t: 'hr' }); i++; continue; }
    if (/^\s*>/.test(line)) {
      var q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { q.push(lines[i].replace(/^\s*> ?/, '')); i++; }
      blocks.push({ t: 'quote', blocks: mdParse(q.join('\n')) });
      continue;
    }
    if (line.indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      var head = cells(line).map(mdInline), rows = [];
      i += 2;
      while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') >= 0) { rows.push(cells(lines[i]).map(mdInline)); i++; }
      blocks.push({ t: 'table', head: head, rows: rows });
      continue;
    }
    if ((m = listRe.exec(line))) {
      var root = { t: m[2].length > 1 && /\d/.test(m[2]) ? 'ol' : 'ul', items: [], indent: m[1].length };
      var stack = [root];
      while (i < lines.length) {
        var lm = listRe.exec(lines[i]);
        if (!lm) {
          if (lines[i].trim() && /^\s{2,}\S/.test(lines[i]) && stack.length) { var tail = stack[stack.length - 1].items; if (tail.length) tail[tail.length - 1].c = tail[tail.length - 1].c.concat([{ t: 'text', v: ' ' }], mdInline(lines[i].trim())); i++; continue; }
          break;
        }
        var ind = lm[1].length, kind = /\d/.test(lm[2]) ? 'ol' : 'ul';
        while (stack.length > 1 && ind < stack[stack.length - 1].indent) stack.pop();
        var top = stack[stack.length - 1];
        if (ind > top.indent && top.items.length) {
          var parent = top.items[top.items.length - 1];
          var sub = { t: kind, items: [], indent: ind };
          (parent.sub = parent.sub || []).push(sub);
          stack.push(sub); top = sub;
        }
        top.items.push({ c: mdInline(lm[3]), sub: null });
        i++;
      }
      blocks.push(root);
      continue;
    }
    var para = [line];
    i++;
    while (i < lines.length && lines[i].trim() && !/^\s*(`{3,}|~{3,}|#{1,6}\s|>|([-*_])(\s*\2){2,}\s*$)/.test(lines[i]) && !listRe.test(lines[i]) && !(lines[i].indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1]))) { para.push(lines[i]); i++; }
    blocks.push({ t: 'p', c: mdInline(para.join('\n')) });
  }
  return blocks;
}
function mdSafeHref(href) { return /^(https?:\/\/|mailto:)/i.test(href) ? href : null; }
function mdInlineNodes(nodes, parent) {
  nodes.forEach(function (n) {
    if (n.t === 'text') {

        // The log may span older, already-finished turns too (capped by item count, not per-turn):
        // only what came after the last user message belongs to the one we're catching up on.
        var lastUserId = 0;
        (d.items || []).forEach(function (it) { if (it.kind === 'user' && it.id > lastUserId) lastUserId = it.id; });
        (d.items || []).forEach(function (it) { if (it.kind !== 'user' && it.id > lastUserId) applyItem(msg, it); });
        msg.pending = Boolean(d.state && d.state.working);
        if (d.state && d.state.contextTokens != null) { c.status = c.status || {}; c.status.contextUsed = d.state.contextTokens; }
        refresh();
      } else if (event === 'item') { applyItem(msg, d.item); if (c.id === CUR) renderMessages(); }
      else if (event === 'context') { c.status = c.status || {}; c.status.contextUsed = d.contextUsed; if (c.id === CUR) renderStatusBar(); }
      else if (event === 'done') { if (d.usage) msg.usage = d.usage; if (d.cost) msg.cost = d.cost; }
      else if (event === 'error') { msg.error = d.message; }
    }).then(function () {
      delete WATCHING[c.id];
      msg.pending = false;
      c.updated = Date.now();
      saveConvos();
      refresh();
    });
  }).catch(function () { delete WATCHING[c.id]; });
}

/* ---- side panels: files, tools & extensions, skills -- one open at a time ---- */
function agentQuery(c) {
  c = c || conv();
  return (c && c.agentId) ? ('agentId=' + encodeURIComponent(c.agentId)) : '';
}
function setSide(which) {
  SIDE_OPEN = SIDE_OPEN === which ? null : which;
  $('filesbox').classList.toggle('on', SIDE_OPEN === 'files');
  $('toolsbox').classList.toggle('on', SIDE_OPEN === 'tools');
  $('skillsbox').classList.toggle('on', SIDE_OPEN === 'skills');
  $('filesbtn').className = SIDE_OPEN === 'files' ? 'on' : '';
  $('toolsbtn').className = SIDE_OPEN === 'tools' ? 'on' : '';
  $('skillsbtn').className = SIDE_OPEN === 'skills' ? 'on' : '';
  reloadSidePanel();
}
function reloadSidePanel() {
  if (SIDE_OPEN === 'files') loadFiles();
  else if (SIDE_OPEN === 'tools') loadTools();
  else if (SIDE_OPEN === 'skills') loadSkills();
}
function prow(name, description, tag) {
  var row = el('div'); row.className = 'prow';
  var nm = el('div'); nm.className = 'nm';
  nm.appendChild(el('b', name));
  if (tag) nm.appendChild(el('span', tag)).className = 'tag';
  row.appendChild(nm);
  if (description) row.appendChild(el('div', description)).className = 'desc';
  return row;
}
function loadSkills() {
  var box = $('skillslist');
  box.replaceChildren(el('div', 'loading…'));
  apiJson('api/skills' + (agentQuery() ? '?' + agentQuery() : '')).then(function (d) {
    box.replaceChildren();
    var skills = d.skills || [];
    if (!skills.length) { box.appendChild(el('div', 'No skills are loaded.')).className = 'empty'; return; }
    skills.forEach(function (s) {
      box.appendChild(prow('/' + s.name, s.description, s.shared ? 'shared: ' + s.shared : s.workspace ? 'workspace' : ''));
    });
  }).catch(function (e) {
    box.replaceChildren(el('div', e.message));
  });
}
function loadTools() {
  var box = $('toolslist');
  box.replaceChildren(el('div', 'loading…'));
  apiJson('api/extensions' + (agentQuery() ? '?' + agentQuery() : '')).then(function (d) {
    box.replaceChildren();
    var files = d.files || [], shared = d.shared || [], commands = d.commands || [];
    if (!files.length && !shared.length && !commands.length) { box.appendChild(el('div', 'No extensions or tools are loaded.')).className = 'empty'; return; }
    if (files.length) {
      box.appendChild(el('div', 'Your extensions')).className = 'psection';
      files.forEach(function (f) { box.appendChild(prow(f.name, '', bytes(f.bytes))); });
    }
    if (shared.length) {
      box.appendChild(el('div', 'Shared (read-only)')).className = 'psection';
      shared.forEach(function (s) { box.appendChild(prow(s.name, '', s.bundle)); });
    }
    if (commands.length) {
      box.appendChild(el('div', 'Tools available')).className = 'psection';
      commands.forEach(function (c) { box.appendChild(prow('/' + c.name, c.description, '')); });
    }
  }).catch(function (e) {
    box.replaceChildren(el('div', e.message));
  });
}

/* ---- files ---- */
function filesUrlFor(agentId, path) {
  var q = agentId ? ('agentId=' + encodeURIComponent(agentId)) : '';
  var p = String(path || '').split('/').filter(Boolean).map(encodeURIComponent).join('/');
  return 'api/files/' + p + (q ? '?' + q : '');
}
function filesUrl(path) {
  var c = conv();
  return filesUrlFor(c && c.agentId, path);
}
function loadFiles() {
  apiJson(filesUrl(FILES_PATH)).then(function (d) {
    renderFiles(d.entries || []);
  }).catch(function (e) {
    $('filelist').replaceChildren(el('div', e.message));
  });
}
function renderFiles(entries) {
  var crumb = $('crumb');
  crumb.replaceChildren();
  var link = function (label, path) { var a = el('a', label); a.addEventListener('click', function () { FILES_PATH = path; loadFiles(); }); return a; };
  crumb.appendChild(link('workspace', ''));
  var parts = FILES_PATH.split('/').filter(Boolean);
  parts.forEach(function (p, i) { crumb.appendChild(document.createTextNode(' / ')); crumb.appendChild(link(p, parts.slice(0, i + 1).join('/'))); });
  var box = $('filelist');
  box.replaceChildren();
  if (parts.length) {
    var up = el('div', '← ..');
    up.className = 'frow';
    up.addEventListener('click', function () { FILES_PATH = parts.slice(0, -1).join('/'); loadFiles(); });
    box.appendChild(up);
  }
  entries.slice().sort(function (a, b) { return (a.type === 'dir' ? 0 : 1) - (b.type === 'dir' ? 0 : 1) || a.name.localeCompare(b.name); }).forEach(function (f) {
    var full = (FILES_PATH ? FILES_PATH + '/' : '') + f.name;
    var row = el('div');
    row.className = 'frow';
    var label = el('span', (f.type === 'dir' ? '📁 ' : '📄 ') + f.name);
    row.appendChild(label);
    var right = el('span');
    if (f.type === 'file') right.appendChild(el('span', bytes(f.bytes))).className = 'sz';
    var del = el('button', '×');
    del.className = 'del';
    del.title = 'delete';
    del.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!confirm('Delete ' + (f.type === 'dir' ? 'the folder' : 'the file') + ' "' + f.name + '"' + (f.type === 'dir' ? ' and everything in it' : '') + '?')) return;
      api(filesUrl(full), { method: 'DELETE' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return loadFiles(); })
        .catch(function (err) { alert('could not delete: ' + err.message); });
    });
    right.appendChild(del);
    row.appendChild(right);
    if (f.type === 'dir') row.addEventListener('click', function () { FILES_PATH = full; loadFiles(); });
    else row.addEventListener('click', function () { previewFile(full, f.bytes); });
    box.appendChild(row);
  });
}
function bytes(n) {
  n = Number(n) || 0;
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}
var IMG_TYPES = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml' };
var HTML_TYPES = { html: true, htm: true };
var PREVIEW_MAX = 300 * 1024;
var MODAL_OBJECT_URL = null;
function closeModal() {
  $('filemodal').hidden = true;
  $('fmbody').replaceChildren();
  $('fmbox').classList.remove('wide');
  if (MODAL_OBJECT_URL) { URL.revokeObjectURL(MODAL_OBJECT_URL); MODAL_OBJECT_URL = null; }
}
/* An image attached inline to a sent message (never uploaded to the workspace) -- the same modal as a
   workspace file's preview, just fed a data: URI directly instead of fetching one. */
function previewDataUrlImage(dataUrl) {
  closeModal();
  $('fmtitle').textContent = 'attached image';
  $('fmmeta').textContent = '';
  var img = el('img'); img.src = dataUrl; img.alt = 'attached image';
  $('fmbody').replaceChildren(img);
  $('filemodal').hidden = false;
  $('fmdownload').href = dataUrl;
  $('fmdownload').download = 'image.png';
}
function previewFile(path, size) {
  var ext = (path.split('.').pop() || '').toLowerCase();
  $('fmtitle').textContent = path;
  $('fmmeta').textContent = bytes(size);
  $('fmbody').replaceChildren(el('div', 'loading…'));
  $('filemodal').hidden = false;
  $('fmdownload').href = filesUrl(path);
  $('fmdownload').download = path.split('/').pop();
  api(filesUrl(path)).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.blob();
  }).then(function (blob) {
    if (IMG_TYPES[ext]) {
      MODAL_OBJECT_URL = URL.createObjectURL(blob);
      var img = el('img'); img.src = MODAL_OBJECT_URL; img.alt = path;
      $('fmbody').replaceChildren(img);
      return;
    }
    if (HTML_TYPES[ext]) {
      if (size > PREVIEW_MAX) { $('fmbody').replaceChildren(el('div', 'Too large to preview (' + bytes(size) + '). Use download.')); return; }
      // srcdoc, not a blob: URL -- a blob's origin belongs to this page, and a sandboxed iframe
      // without allow-same-origin cannot reliably load one across browsers (it can render as a
      // download or plain text instead). srcdoc has no such origin mismatch.
      blob.text().then(function (html) {
        var frame = el('iframe');
        // No allow-same-origin: a workspace page can run its own script, but gets a unique, opaque
        // origin -- it can never read this page's sessionStorage, cookies, or API key.
        frame.setAttribute('sandbox', 'allow-scripts');
        frame.className = 'htmlpreview';
        frame.srcdoc = html;
        $('fmbox').classList.add('wide');
        $('fmbody').replaceChildren(frame);
      });
      return;
    }
    if (size > PREVIEW_MAX) {
      $('fmbody').replaceChildren(el('div', 'Too large to preview (' + bytes(size) + '). Use download.'));
      return;
    }
    blob.text().then(function (text) {
      // A NUL byte almost never appears in real text; good enough to tell "probably binary" apart.
      if (text.indexOf('\u0000') >= 0) { $('fmbody').replaceChildren(el('div', 'This does not look like a text file. Use download.')); return; }
      $('fmbody').replaceChildren(el('pre', text));
    });
  }).catch(function (e) { $('fmbody').replaceChildren(el('div', 'cannot show it: ' + e.message)); });
}
/* ---- composer attachments ---- */
function renderPending() {
  var box = $('pending');
  box.replaceChildren();
  PENDING_IMAGES.forEach(function (img, i) {
    var chip = el('div'); chip.className = 'chip';
    var thumb = el('img'); thumb.src = img.dataUrl;
    chip.appendChild(thumb);
    chip.appendChild(el('span', img.name)).className = 'nm';
    var rm = el('span', '×'); rm.className = 'rm';
    rm.addEventListener('click', function () { PENDING_IMAGES.splice(i, 1); renderPending(); });
    chip.appendChild(rm);
    box.appendChild(chip);
  });
  PENDING_DOCS.forEach(function (doc, i) {
    var chip = el('div'); chip.className = 'chip' + (doc.uploading ? ' busy' : '');
    chip.appendChild(el('span', '📄 ' + doc.name)).className = 'nm';
    var rm = el('span', '×'); rm.className = 'rm';
    rm.addEventListener('click', function () { PENDING_DOCS.splice(i, 1); renderPending(); });
    chip.appendChild(rm);
    box.appendChild(chip);
  });
  box.hidden = !PENDING_IMAGES.length && !PENDING_DOCS.length;
}
function addImageFile(f) {
  if (PENDING_IMAGES.length >= ATTACH_MAX_IMAGES) { alert('at most ' + ATTACH_MAX_IMAGES + ' images per message'); return; }
  if (f.size > ATTACH_MAX_BYTES) { alert(f.name + ' is too large (over ' + bytes(ATTACH_MAX_BYTES) + ')'); return; }
  var reader = new FileReader();
  reader.onload = function () {
    PENDING_IMAGES.push({ name: f.name, dataUrl: reader.result });
    renderPending();
  };
  reader.readAsDataURL(f);
}
function addDocFile(f) {
  var entry = { name: f.name, path: 'uploads/' + f.name, uploading: true };
  PENDING_DOCS.push(entry);
  renderPending();
  api(filesUrl(entry.path), { method: 'PUT', body: f }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    entry.uploading = false;
    entry.bytes = f.size;
    renderPending();
  }).catch(function (e) {
    PENDING_DOCS = PENDING_DOCS.filter(function (d) { return d !== entry; });
    renderPending();
    alert('could not upload ' + f.name + ': ' + e.message);
  });
}
function addAttachments(fileList) {
  Array.prototype.slice.call(fileList || []).forEach(function (f) {
    if (f.type && f.type.indexOf('image/') === 0) addImageFile(f); else addDocFile(f);
  });
}
function uploadFiles(fileList) {
  var files = Array.prototype.slice.call(fileList || []);
  if (!files.length) return;
  Promise.all(files.map(function (f) {
    var path = (FILES_PATH ? FILES_PATH + '/' : '') + f.name;
    return api(filesUrl(path), { method: 'PUT', body: f }).then(function (r) { if (!r.ok) throw new Error(f.name + ': HTTP ' + r.status); });
  })).then(loadFiles).catch(function (e) { alert('could not upload: ' + e.message); loadFiles(); });
}

/* ---- login/logout ---- */
function connect(key) {
  KEY = key;
  return apiJson('api/whoami').then(function (d) {
    WHOAMI = d;
    sessionStorage.setItem('piper-portal-key', KEY);
    loadConvos();
    return pullHistory();
  }).then(function () {
    if (!CONVOS.length) newChat(); else CUR = CONVOS[0].id;
    renderTargets();
    showApp();
    renderAll();
    // Every conversation, not just the one on screen: any of them might still be running from
    // before this login/reload, and each catches up (or stays quiet) independently.
    CONVOS.forEach(function (c) { resumeIfLive(c); });
  }).catch(function (e) {
    KEY = '';
    showLogin(e.message);
  });
}
$('connect').addEventListener('click', function () {
  var key = $('keyinput').value.trim();
  if (!key) return;
  connect(key);
});
$('keyinput').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('connect').click(); });
function connectWithPassword(username, password) {
  fetch('api/login-password', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: username, password: password }) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status)); return j; }); })
    .then(function (j) { return connect(j.token); })
    .catch(function (e) { showLogin(e.message); });
}
$('tabkey').addEventListener('click', function () {
  $('tabkey').className = 'tab on'; $('tabpass').className = 'tab';
  $('keyform').hidden = false; $('passform').hidden = true;
});
$('tabpass').addEventListener('click', function () {
  $('tabpass').className = 'tab on'; $('tabkey').className = 'tab';
  $('passform').hidden = false; $('keyform').hidden = true;
});
$('connectpass').addEventListener('click', function () {
  var username = $('loginuser').value.trim(), password = $('loginpass').value;
  if (!username || !password) return;
  connectWithPassword(username, password);
});
$('loginpass').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('connectpass').click(); });
$('logout').addEventListener('click', function () {
  sessionStorage.removeItem('piper-portal-key');
  sessionStorage.removeItem(convKey());
  KEY = ''; WHOAMI = null; CONVOS = []; CUR = null;
  showLogin();
});
$('newchat').addEventListener('click', function () { newChat(); });
$('target').addEventListener('change', function () { var c = conv(); if (!c || c.messages.length) return; c.agentId = $('target').value; saveConvos(); renderAll(); });
$('send').addEventListener('click', function () {
  var c = conv();
  if (!c) return;
  if (!isBusy(c)) return send();
  var q = agentQuery(c);
  api('api/conversation/' + encodeURIComponent(c.id) + '/interrupt' + (q ? '?' + q : ''), { method: 'POST' }).catch(function () {});
});
$('input').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('input').addEventListener('paste', function (e) {
  var files = (e.clipboardData && e.clipboardData.files) || [];
  if (!files.length) return;
  e.preventDefault();
  addAttachments(files);
});
$('attachbtn').addEventListener('click', function () { $('attachinput').click(); });
$('attachinput').addEventListener('change', function () { addAttachments(this.files); this.value = ''; });
$('toolToggle').checked = SHOW_TOOLS;
$('toolToggle').addEventListener('change', function () {
  SHOW_TOOLS = this.checked;
  try { localStorage.setItem('piper-portal-showtools', SHOW_TOOLS ? '1' : '0'); } catch (e) { /* not fatal */ }
  renderMessages();
});
$('filesbtn').addEventListener('click', function () { setSide('files'); });
$('toolsbtn').addEventListener('click', function () { setSide('tools'); });
$('skillsbtn').addEventListener('click', function () { setSide('skills'); });
$('toolsrefresh').addEventListener('click', loadTools);
$('skillsrefresh').addEventListener('click', loadSkills);
$('filesrefresh').addEventListener('click', loadFiles);
$('uploadbtn').addEventListener('click', function () { $('uploadinput').click(); });
$('uploadinput').addEventListener('change', function () { uploadFiles(this.files); this.value = ''; });
$('fmclose').addEventListener('click', closeModal);
$('filemodal').addEventListener('click', function (e) { if (e.target === $('filemodal')) closeModal(); });

/* ---- portal password: an alternative login, set up from inside the portal itself ---- */
function renderPassModal() {
  var box = $('pmbody');
  box.replaceChildren();
  var user = WHOAMI && WHOAMI.portalUsername;
  box.appendChild(el('p', user ? 'Signed in with "' + user + '" also works to log in to the portal, instead of the API key.' : 'Set a username and password to log in to the portal without the API key.')).className = 'hint';
  var uIn = el('input'); uIn.placeholder = 'username'; uIn.value = user || '';
  var pIn = el('input'); pIn.type = 'password'; pIn.placeholder = user ? 'new password' : 'password';
  var row1 = el('div'); row1.className = 'row'; row1.appendChild(uIn);
  var row2 = el('div'); row2.className = 'row'; row2.appendChild(pIn);
  var saveBtn = el('button', user ? 'change password' : 'set password');
  var row3 = el('div'); row3.className = 'row'; row3.appendChild(saveBtn);
  var note = el('div'); note.className = 'hint';
  box.appendChild(row1); box.appendChild(row2); box.appendChild(row3); box.appendChild(note);
  saveBtn.addEventListener('click', function () {
    var username = uIn.value.trim(), password = pIn.value;
    if (!username || !password) return;
    api('api/portal-password', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: username, password: password }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status)); return j; }); })
      .then(function (j) { WHOAMI.portalUsername = j.username; renderPassModal(); })
      .catch(function (e) { note.textContent = e.message; note.className = 'hint bad'; });
  });
  if (user) {
    var rmBtn = el('button', 'remove password');
    var row4 = el('div'); row4.className = 'row'; row4.appendChild(rmBtn);
    box.appendChild(row4);
    rmBtn.addEventListener('click', function () {
      if (!confirm('Remove the portal password? Logging in will need the API key again, and this ends right away if you are signed in with a password now.')) return;
      api('api/portal-password', { method: 'DELETE' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        // If this very session was a password login, it just ended with the password -- the next
        // call would 401; check now, cleanly, rather than leave every other button quietly broken.
        return apiJson('api/whoami').then(function (d) { WHOAMI = d; renderPassModal(); }).catch(function () {
          sessionStorage.removeItem('piper-portal-key');
          sessionStorage.removeItem(convKey());
          KEY = ''; WHOAMI = null; CONVOS = []; CUR = null;
          $('passmodal').hidden = true;
          showLogin('The portal password was removed, and this signed-in session ended with it -- log in again.');
        });
      }).catch(function (e) { note.textContent = e.message; note.className = 'hint bad'; });
    });
  }
}
$('passbtn').addEventListener('click', function () { renderPassModal(); $('passmodal').hidden = false; });
$('pmclose').addEventListener('click', function () { $('passmodal').hidden = true; });
$('passmodal').addEventListener('click', function (e) { if (e.target === $('passmodal')) $('passmodal').hidden = true; });

if (KEY) connect(KEY); else showLogin();
</script>
